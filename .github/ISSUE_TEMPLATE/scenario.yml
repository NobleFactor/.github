name: Scenario
description: 'A scenario: what someone wants to do, how to walk through it, and the features it uses'
type: Scenario
body:
- type: dropdown
  id: area
  attributes:
    label: Area
    description: Is this issue's own work product or engineering?
    options:
    - Product
    - Engineering
  validations:
    required: true
- type: textarea
  id: goal
  attributes:
    label: What the person wants to do
    description: Say it the way they would.
  validations:
    required: true
- type: textarea
  id: walk
  attributes:
    label: How to walk through it
    description: The steps, and what you should see. Use it for a demo or a quick test.
  validations:
    required: true
- type: textarea
  id: features
  attributes:
    label: The features it uses
    description: List each one by its issue.
  validations:
    required: true
- type: textarea
  id: documents
  attributes:
    label: Plan and design documents
    description: The plan, if one is opened, and the design documents this bears on.
    value: |
      | Document | Link |
      | --- | --- |
      | Plan | Not yet opened |
  validations:
    required: true
